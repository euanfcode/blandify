<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="Blandify helps you sound like everyone else." name="description"/>
<title>Blandify</title>
<style>
:root{
  --background:#f7f5ef;
  --panel:#fbfaf7;
  --text:#111;
  --muted:#686868;
  --border:#1b1b1b;
  --soft-border:#d8d5cc;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--background);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
main{
  width:min(1120px,calc(100% - 40px));
  margin:0 auto;
  padding:48px 0 64px;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:64px;
}
.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
}
h1,#output{
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
h1{
  margin:0;
  font-size:clamp(52px,8vw,82px);
  font-weight:500;
  letter-spacing:-.04em;
  line-height:.95;
}
.workspace{
  display:grid;
  grid-template-columns:1fr 56px 1fr;
  gap:18px;
  align-items:start;
}
.panel-heading{
  display:flex;
  justify-content:space-between;
  gap:16px;
  margin-bottom:9px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}
textarea,#output{
  display:block;
  width:100%;
  min-height:270px;
  padding:22px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
}
textarea{
  resize:vertical;
  font:inherit;
  font-size:16px;
  line-height:1.55;
}
textarea:focus{
  outline:2px solid var(--text);
  outline-offset:3px;
}
#output{
  overflow-wrap:anywhere;
  white-space:pre-wrap;
  font-size:23px;
  line-height:1.32;
}
#output.empty{color:#88867f}
#processingMark{
  min-height:270px;
  display:flex;
  align-items:center;
  justify-content:center;
}
#processingMark img{
  width:34px;
  height:34px;
  object-fit:contain;
  opacity:0;
  transform:scale(.95);
  transition:opacity .25s ease,transform .25s ease;
}
#processingMark.is-processing img{
  opacity:1;
  animation:processingPulse 2.8s ease-in-out infinite;
}
@keyframes processingPulse{
  0%,100%{transform:translateY(0) rotate(0deg) scale(.95);opacity:.45}
  50%{transform:translateY(-3px) rotate(5deg) scale(1.03);opacity:1}
}
@media(prefers-reduced-motion:reduce){
  #processingMark.is-processing img{animation:none;opacity:.75}
}
.actions{
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:24px;
}
button{
  border:1px solid var(--text);
  padding:14px 24px;
  background:var(--text);
  color:#fff;
  font:inherit;
  font-size:14px;
  cursor:pointer;
}
button:hover{
  background:transparent;
  color:var(--text);
}
button:disabled{
  cursor:wait;
  opacity:.5;
}
#copyButton{
  display:none;
  background:transparent;
  color:var(--text);
}
#copyButton:hover{
  background:var(--text);
  color:#fff;
}
#status{
  min-height:22px;
  margin-top:18px;
  color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;
  font-size:15px;
  font-style:italic;
}
#error{
  display:none;
  margin-top:16px;
  font-size:14px;
}
#report{
  display:none;
  max-width:540px;
  margin-top:28px;
  border:1px solid var(--soft-border);
  padding:20px;
  font-size:13px;
  line-height:1.8;
}
#report dl{
  display:grid;
  grid-template-columns:1fr auto;
  gap:4px 24px;
  margin:0;
}
#report dt,#report dd{margin:0}
#report dd{font-weight:700}
.linkedin{
  margin:16px 0 0;
  padding-top:14px;
  border-top:1px solid var(--soft-border);
  font-weight:700;
}
@media(max-width:760px){
  main{
    width:min(100% - 28px,1120px);
    padding-top:30px;
  }
  .brand{margin-bottom:40px}
  .workspace{grid-template-columns:1fr}
  #processingMark{min-height:40px}
  textarea,#output{min-height:220px}
}
</style>
</head>
<body>
<main>
<header>
<div class="brand"><img alt="" onerror="this.remove()" src="logo.png"/><h1>Blandify</h1></div>
</header>
<section aria-label="Blandify writing tool" class="workspace">
<div>
<div class="panel-heading"><span>Original</span><span id="wordCount">0 / 250 words</span></div>
<textarea aria-label="Original writing" id="input" maxlength="2500" placeholder="Paste your writing to begin"></textarea>
</div><div aria-hidden="true" id="processingMark"><img alt="" src="logo.png"/></div>

<div>
<div class="panel-heading"><span>Blandified</span></div>
<div aria-live="polite" class="empty" id="output">Your optimised communication will appear here.</div>
</div>
</section>
<div class="actions"><button id="blandifyButton" type="button">Conform</button><button id="copyButton" type="button">Copy approved version</button></div>
<div aria-live="polite" id="status"></div><div id="error" role="alert"></div>
<aside id="report"><dl><dt>Humanity remaining</dt><dd>4%</dd><dt>Personality detected</dt><dd>MINIMAL</dd><dt>Nuance removed</dt><dd>98%</dd><dt>Generic alignment</dt><dd>OPTIMAL</dd></dl><p class="linkedin">Ready to post on LinkedIn.</p></aside>
</main>
<script>
const input=document.querySelector('#input');
const output=document.querySelector('#output');
const wordCount=document.querySelector('#wordCount');
const blandifyButton=document.querySelector('#blandifyButton');
const copyButton=document.querySelector('#copyButton');
const status=document.querySelector('#status');
const error=document.querySelector('#error');
const report=document.querySelector('#report');
const processingMark=document.querySelector('#processingMark');

const loadingMessages=[
  'Initialising language model...',
  'Detecting personality...',
  'Removing human characteristics...',
  'Flattening emotional variance...',
  'Standardising communication patterns...',
  'Optimising for professional ambiguity...',
  'Finalising acceptable output...'
];

const countWords=value=>{
  const t=value.trim();
  return t?t.split(/\s+/).length:0;
};

function updateWordCount(){
  const words=countWords(input.value);
  wordCount.textContent=`${words} / 250 words`;
  wordCount.style.fontWeight=words>250?'700':'400';
}

const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

function shuffledMessages(){
  return [...loadingMessages].sort(()=>Math.random()-.5).slice(0,5);
}

async function runLoadingSequence(){
  await wait(300);
  for(const message of shuffledMessages()){
    status.textContent=message;
    await wait(950);
  }
}

async function blandifyText(text){
  const response=await fetch('/api/blandify',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text})
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Blandification failed.');
  return data.text;
}

async function handleBlandify(){
  const text=input.value.trim();
  const words=countWords(text);

  error.style.display='none';
  report.style.display='none';
  copyButton.style.display='none';

  if(!text){
    error.textContent='Paste some writing first.';
    error.style.display='block';
    input.focus();
    return;
  }

  if(words>250){
    error.textContent='Please keep the original to 250 words or fewer.';
    error.style.display='block';
    input.focus();
    return;
  }

  blandifyButton.disabled=true;
  blandifyButton.textContent='Conforming...';
  output.classList.add('empty');
  output.textContent='Conformity pending...';
  processingMark?.classList.add('is-processing');

  try{
    const[blandified]=await Promise.all([
      blandifyText(text),
      runLoadingSequence()
    ]);

    status.textContent='✓ Blandification complete.';
    await wait(900);

    output.textContent=blandified;
    output.classList.remove('empty');
    report.style.display='block';
    copyButton.style.display='inline-block';
    status.textContent='';
    blandifyButton.textContent='Conform further';
  }catch(caughtError){
    output.textContent='Your optimised communication will appear here.';
    output.classList.add('empty');
    status.textContent='';
    error.textContent=caughtError.message;
    error.style.display='block';
    blandifyButton.textContent='Conform';
  }finally{
    blandifyButton.disabled=false;
    processingMark?.classList.remove('is-processing');
  }
}

async function handleCopy(){
  await navigator.clipboard.writeText(output.textContent);
  copyButton.textContent='Copied';
  setTimeout(()=>copyButton.textContent='Copy approved version',1400);
}

input.addEventListener('input',updateWordCount);
blandifyButton.addEventListener('click',handleBlandify);
copyButton.addEventListener('click',handleCopy);
updateWordCount();
</script>
</body>
</html>
