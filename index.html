<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="Blandify helps you sound like everyone else." name="description"/>
<title>Blandify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
:root{--background:#f7f5ef;--panel:#fbfaf7;--text:#111;--muted:#686868;--border:#1b1b1b;--soft-border:#d8d5cc}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--text);font-family:Arial,Helvetica,sans-serif}
main{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:42px 0 56px}
.brand{display:flex;align-items:center;margin-bottom:56px}
h1{margin:0;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:clamp(56px,8vw,86px);font-weight:500;line-height:.95}
.wordmark{display:inline-flex;align-items:flex-end;white-space:nowrap}
.wordmark-b{width:.69em;height:.94em;flex:none;overflow:visible;margin-right:-.045em;transform:translateY(-.015em)}
.wordmark-b text{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:100px;font-weight:500;fill:currentColor}
.wordmark-rest{letter-spacing:-.04em}
.workspace{display:grid;grid-template-columns:1fr 110px 1fr;gap:24px;align-items:center}
textarea,#output{display:block;width:100%;height:300px;min-height:300px;padding:22px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:23px;line-height:1.45}
textarea{resize:none;overflow-y:auto}
textarea:focus{outline:2px solid var(--text);outline-offset:3px}
#output{overflow-y:auto;overflow-wrap:anywhere;white-space:pre-wrap}
#output.empty{color:#88867f}
#processingMark{height:300px;display:flex;align-items:center;justify-content:center;pointer-events:none}
#processingMark img{width:70px;height:70px;object-fit:contain;opacity:.9;transform:scale(1)}
#processingMark.is-processing img{animation:blandifyProcessing 1.8s ease-in-out infinite}
@keyframes blandifyProcessing{0%,100%{opacity:.68;transform:scale(.92)}50%{opacity:1;transform:scale(1.1)}}
.actions{display:flex;align-items:center;gap:14px;margin-top:22px}
button{position:relative;overflow:hidden;border:1px solid var(--text);padding:14px 24px;background:var(--text);color:#fff;font:inherit;font-size:14px;cursor:pointer;transition:background .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease}
button:hover{background:transparent;color:var(--text)}
button:disabled{cursor:wait}
#blandifyButton:not(.has-run){animation:magicPulse 1.8s ease-in-out infinite}
#blandifyButton:not(.has-run)::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0%,transparent 34%,rgba(255,255,255,.14) 44%,rgba(255,255,255,.92) 50%,rgba(255,255,255,.14) 56%,transparent 66%,transparent 100%);transform:translateX(-140%);animation:magicSweep 1.55s ease-in-out infinite;pointer-events:none}
#blandifyButton:not(.has-run)::after{content:"✦";position:absolute;right:8px;top:3px;font-size:10px;opacity:.2;animation:magicSpark 1.35s ease-in-out infinite;pointer-events:none}
#blandifyButton.is-processing,#blandifyButton.is-processing:hover{opacity:1;color:#fff;background:#111;border-color:#111;animation:none;box-shadow:none}
#blandifyButton.is-processing::before,#blandifyButton.is-processing::after{content:none;animation:none}
@keyframes magicPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 1px rgba(17,17,17,.08),0 0 8px rgba(17,17,17,.06)}50%{transform:scale(1.025);box-shadow:0 0 0 3px rgba(17,17,17,.06),0 0 20px rgba(17,17,17,.18)}}
@keyframes magicSweep{0%{transform:translateX(-140%);opacity:0}18%{opacity:1}72%{opacity:1}100%{transform:translateX(140%);opacity:0}}
@keyframes magicSpark{0%,100%{opacity:.12;transform:scale(.7) rotate(0deg)}50%{opacity:.8;transform:scale(1.15) rotate(90deg)}}
#copyButton{display:none;background:transparent;color:var(--text)}
#copyButton:hover{background:var(--text);color:#fff}
#status{min-height:22px;margin-top:18px;color:var(--muted);font-family:Georgia,"Times New Roman",serif;font-size:15px;font-style:italic}
#error{display:none;margin-top:16px;font-size:14px;white-space:pre-wrap}
#report{display:none;max-width:540px;margin-top:26px;border:1px solid var(--soft-border);padding:18px;font-size:13px;line-height:1.8}
#report dl{display:grid;grid-template-columns:1fr auto;gap:4px 24px;margin:0}
#report dt,#report dd{margin:0}
#report dd{font-weight:700}
.linkedin{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--soft-border);font-weight:700}
@media(prefers-reduced-motion:reduce){#processingMark.is-processing img,#blandifyButton:not(.has-run),#blandifyButton:not(.has-run)::before,#blandifyButton:not(.has-run)::after{animation:none}}
@media(max-width:760px){main{width:min(100% - 28px,1180px);padding-top:28px}.brand{margin-bottom:36px}.workspace{grid-template-columns:1fr;gap:18px}#processingMark{height:80px}#processingMark img{width:58px;height:58px}textarea,#output{height:230px;min-height:230px}}
</style>
</head>
<body>
<main>
<header><div class="brand"><h1 class="wordmark" aria-label="Blandify"><svg class="wordmark-b" viewBox="0 0 72 100" aria-hidden="true" focusable="false"><defs><clipPath id="b-top"><rect x="-8" y="0" width="90" height="31"/></clipPath><clipPath id="b-mid"><rect x="-8" y="33" width="90" height="32"/></clipPath><clipPath id="b-bot"><rect x="-8" y="67" width="90" height="33"/></clipPath></defs><text x="-1" y="86" clip-path="url(#b-top)">B</text><text x="0.8" y="86" clip-path="url(#b-mid)">B</text><text x="-0.2" y="86" clip-path="url(#b-bot)">B</text></svg><span class="wordmark-rest">landify</span></h1></div></header>
<section aria-label="Blandify writing tool" class="workspace">
<div><textarea aria-label="Original writing" id="input" maxlength="2500" placeholder="Give me your human writing."></textarea></div>
<div aria-hidden="true" id="processingMark"><img alt="" src="logo.png"/></div>
<div><div aria-live="polite" class="empty" id="output">Your optimised communication will appear here.</div></div>
</section>
<div class="actions"><button id="blandifyButton" type="button">Conform</button><button id="copyButton" type="button">Copy approved version</button></div>
<div aria-live="polite" id="status"></div><div id="error" role="alert"></div>
<aside id="report"><dl><dt>Humanity remaining</dt><dd>4%</dd><dt>Personality detected</dt><dd>MINIMAL</dd><dt>Nuance removed</dt><dd>98%</dd><dt>Generic alignment</dt><dd>OPTIMAL</dd></dl><p class="linkedin">Ready to post on LinkedIn.</p></aside>
</main>
<script>
const input=document.querySelector('#input');
const output=document.querySelector('#output');
const blandifyButton=document.querySelector('#blandifyButton');
const copyButton=document.querySelector('#copyButton');
const status=document.querySelector('#status');
const error=document.querySelector('#error');
const report=document.querySelector('#report');
const processingMark=document.querySelector('#processingMark');
const loadingMessages=['Initialising language model...','Detecting personality...','Removing human characteristics...','Flattening emotional variance...','Standardising communication patterns...','Optimising for professional ambiguity...','Finalising acceptable output...'];
const countWords=value=>{const t=value.trim();return t?t.split(/\s+/).length:0};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function shuffledMessages(){return [...loadingMessages].sort(()=>Math.random()-.5).slice(0,5)}
async function runLoadingSequence(){await wait(250);for(const message of shuffledMessages()){status.textContent=message;await wait(850)}}
async function blandifyText(text){
  const response=await fetch('/api/conform',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const raw=await response.text();
  let data={};
  try{data=raw?JSON.parse(raw):{}}catch{data={}}
  if(!response.ok){throw new Error(data.error||raw||`Blandify request failed (${response.status}).`)}
  if(typeof data.text!=='string'||!data.text.trim()){throw new Error('Blandify returned an empty response.')}
  return data.text.trim();
}
async function handleBlandify(){
  const text=input.value.trim();
  const words=countWords(text);
  error.style.display='none';report.style.display='none';copyButton.style.display='none';
  if(!text){error.textContent='Paste some writing first.';error.style.display='block';input.focus();return}
  if(words>250){error.textContent='Please keep the original to 250 words or fewer.';error.style.display='block';input.focus();return}
  blandifyButton.classList.add('has-run');
  blandifyButton.disabled=true;
  blandifyButton.classList.add('is-processing');
  blandifyButton.textContent='Conforming ✦';
  output.classList.add('empty');
  output.textContent='Conformity pending...';
  processingMark?.classList.add('is-processing');
  try{
    const[blandified]=await Promise.all([blandifyText(text),runLoadingSequence()]);
    status.textContent='✓ Blandification complete.';
    await wait(550);
    output.textContent=blandified;
    output.classList.remove('empty');
    report.style.display='block';
    copyButton.style.display='inline-block';
    status.textContent='';
    blandifyButton.textContent='Conform further';
  }catch(caughtError){
    output.textContent='Your optimised communication will appear here.';
    output.classList.add('empty');
    status.textContent='';
    error.textContent=caughtError.message;
    error.style.display='block';
    blandifyButton.textContent='Conform';
  }finally{
    blandifyButton.disabled=false;
    blandifyButton.classList.remove('is-processing');
    processingMark?.classList.remove('is-processing');
  }
}
async function handleCopy(){await navigator.clipboard.writeText(output.textContent);copyButton.textContent='Copied';setTimeout(()=>copyButton.textContent='Copy approved version',1400)}
blandifyButton.addEventListener('click',handleBlandify);
copyButton.addEventListener('click',handleCopy);
</script>
</body>
</html>
